<svg xmlns="http://www.w3.org/2000/svg" width="760" height="250" viewBox="0 0 760 250" role="img" aria-label="Non-CBC: check : Ctx → Expr → Type → Bool; infer : Ctx → Expr → Option Type. CBC: check : (Γ : Ctx) (t : Expr) (T : Type) → Option (Γ ⊢ t : T); infer : (Γ : Ctx) (t : Expr) → Option ((T : Type) × (Γ ⊢ t : T))">
  <style>
    .bg { fill: #f6f8fa; stroke: #d0d7de; }
    .rule { stroke: #d0d7de; }
    .code { font-family: "JetBrains Mono", "Cascadia Code", Consolas, "DejaVu Sans Mono", Menlo, monospace; font-size: 17px; fill: #1f2328; }
    .label { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 600; letter-spacing: 0.08em; }
    .lbad { fill: #8c959f; }
    .lgood { fill: #1a7f37; }
    .fn { fill: #0550ae; font-weight: 700; }
    .ty { fill: #0a7c6b; }
    .var { fill: #bc4c00; font-style: italic; }
    .jd { fill: #8250df; font-weight: 700; }
    .op { fill: #6e7781; }
    .weak { fill: #cf222e; }
