      .bg { fill: #161b22; stroke: #30363d; }
      .rule { stroke: #30363d; }
      .code { fill: #e6edf3; }
      .lbad { fill: #8b949e; }
      .lgood { fill: #3fb950; }
      .fn { fill: #79c0ff; }
      .ty { fill: #56d4bc; }
      .var { fill: #ffa657; }
      .jd { fill: #d2a8ff; }
      .op { fill: #8b949e; }
      .weak { fill: #ff7b72; }
    }
  </style>
  <rect class="bg" x="0.5" y="0.5" width="759" height="249" rx="10"/>

