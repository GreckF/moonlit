  <text class="code" x="28" y="66" xml:space="preserve"><tspan class="fn">check</tspan> <tspan class="op">:</tspan> <tspan class="ty">Ctx</tspan> <tspan class="op">→</tspan> <tspan class="ty">Expr</tspan> <tspan class="op">→</tspan> <tspan class="ty">Type</tspan> <tspan class="op">→</tspan> <tspan class="weak">Bool</tspan></text>
  <text class="code" x="28" y="94" xml:space="preserve"><tspan class="fn">infer</tspan> <tspan class="op">:</tspan> <tspan class="ty">Ctx</tspan> <tspan class="op">→</tspan> <tspan class="ty">Expr</tspan> <tspan class="op">→</tspan> <tspan class="ty">Option</tspan> <tspan class="op">(</tspan><tspan class="weak">Type</tspan><tspan class="op">)</tspan></text>

  <line class="rule" x1="28" y1="122" x2="732" y2="122" stroke-dasharray="4 4"/>

  <text class="label lgood" x="28" y="154">CBC</text>
  <text class="code" x="28" y="184" xml:space="preserve"><tspan class="fn">check</tspan> <tspan class="op">:</tspan> <tspan class="op">(</tspan><tspan class="var">Γ</tspan> <tspan class="op">:</tspan> <tspan class="ty">Ctx</tspan><tspan class="op">)</tspan> <tspan class="op">(</tspan><tspan class="var">t</tspan> <tspan class="op">:</tspan> <tspan class="ty">Expr</tspan><tspan class="op">)</tspan> <tspan class="op">(</tspan><tspan class="var">T</tspan> <tspan class="op">:</tspan> <tspan class="ty">Type</tspan><tspan class="op">)</tspan> <tspan class="op">→</tspan> <tspan class="ty">Option</tspan> <tspan class="op">(</tspan><tspan class="var">Γ</tspan> <tspan class="jd">⊢</tspan> <tspan class="var">t</tspan> <tspan class="jd">:</tspan> <tspan class="var">T</tspan><tspan class="op">)</tspan></text>
  <text class="code" x="28" y="212" xml:space="preserve"><tspan class="fn">infer</tspan> <tspan class="op">:</tspan> <tspan class="op">(</tspan><tspan class="var">Γ</tspan> <tspan class="op">:</tspan> <tspan class="ty">Ctx</tspan><tspan class="op">)</tspan> <tspan class="op">(</tspan><tspan class="var">t</tspan> <tspan class="op">:</tspan> <tspan class="ty">Expr</tspan><tspan class="op">)</tspan> <tspan class="op">→</tspan> <tspan class="ty">Option</tspan> <tspan class="op">((</tspan><tspan class="var">T</tspan> <tspan class="op">:</tspan> <tspan class="ty">Type</tspan><tspan class="op">)</tspan> <tspan class="jd">×</tspan> <tspan class="op">(</tspan><tspan class="var">Γ</tspan> <tspan class="jd">⊢</tspan> <tspan class="var">t</tspan> <tspan class="jd">:</tspan> <tspan class="var">T</tspan><tspan class="op">))</tspan></text>
